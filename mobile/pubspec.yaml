name: rumo_mobile
description: "Rumo — registre, visualize e compartilhe suas atividades ao ar livre."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  file_picker: ^13.3.3
  # [Sessão 37] Export mobile (unitário + lote) + share sheet nativo.
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  # [Sessão 38] Charts weekly/monthly do perfil (Dart puro, sem código nativo).
  fl_chart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # [Sessão 42] Identidade visual — ícone do app + splash nativo.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  # [Sessão 42] Pasta de assets para o ícone fonte (logo1024.png).
  assets:
    - assets/icon/

# [Sessão 42] Config do flutter_launcher_icons — gera os mipmaps Android e
# AppIcon.appiconset iOS a partir de assets/icon/logo1024.png.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#fff7ed"
  adaptive_icon_foreground: "assets/icon/logo1024.png"

# [Sessão 42] Config do flutter_native_splash — splash nativo Android/iOS.
flutter_native_splash:
  color: "#fff7ed"
  image: assets/icon/logo1024.png
  android: true
  ios: true
  android_12:
    color: "#fff7ed"
    image: assets/icon/logo1024.png