services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rumo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rumo
      POSTGRES_PASSWORD: rumo_dev_password
      POSTGRES_DB: rumo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumo -d rumo_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rumo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: rumo_postgres_data
  redis_data:
    name: rumo_redis_data