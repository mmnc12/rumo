[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra --strict-markers

# [Sessão 15] Silencia o ruído de deprecation do fitparse (dependência
# dormente; última release 1.2.0, de 2020). Os warnings vêm de
# fitparse.processors usando datetime.utcfromtimestamp(), deprecado no
# Python 3.12+. Filtro cirúrgico por módulo — não afeta warnings de
# SQLAlchemy, Pydantic, asyncpg nem código nosso.
# DÍVIDA TÉCNICA: migrar para fitdecode (ativo, mantido, sem
# utcfromtimestamp). Quando migrar, remover este filtro.
filterwarnings =
    ignore::DeprecationWarning:fitparse\.processors